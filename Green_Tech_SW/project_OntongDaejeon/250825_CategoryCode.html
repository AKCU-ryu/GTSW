<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CategoryCode</title>
</head>

<body>

    <div id="map" style="width:500px;height:400px;"></div>
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=7bdd6f8f52c48f9801f463f213f0d03e&libraries=services"></script>
    
    <script>
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(33.450701, 126.570667),
            level: 3
        };

        var map = new kakao.maps.Map(container, options);

        var places = new kakao.maps.services.Places();

        var callback = function (result, status) {
            if (status === kakao.maps.services.Status.OK) {
                console.log(result);
            }
        };

        // 공공기관 코드 검색
        places.categorySearch('PO3', callback, {
            // Map 객체를 지정하지 않았으므로 좌표객체를 생성하여 넘겨준다.
            location: new kakao.maps.LatLng(37.564968, 126.939909)
        });

    </script>
</body>

</html>

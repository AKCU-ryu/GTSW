<!doctype html>
<html lang="ko" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>온통대전 가맹점 검색 (지도+표 단일파일)</title>
  <!-- 초기 다크모드 메뉴x -->
   
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Kakao Map SDK (services 포함) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7bdd6f8f52c48f9801f463f213f0d03e&libraries=services"></script>
  <style>
    :root { color-scheme: dark; }
    body{ background:#0b0c0f; }
    .topbar{ background:#ff7a00; height:64px; }
    .topbar .form-control{ background:#1b1e23; border-color:#2a2f36; color:#eaecef; }
    .topbar .btn{ border-color:#2a2f36; }
    #map{ width:100%; height:58vh; } /* 표 붙였으니 높이 조정 */
    /* 진입 모션 */
    .fade-in{ opacity:0; transform:translateY(-24px); animation:fadeIn .6s ease forwards; }
    .slide-in-left{ opacity:0; transform:translateX(-24px); animation:inL .5s .1s ease forwards; }
    .slide-in-right{ opacity:0; transform:translateX(24px); animation:inR .5s .1s ease forwards; }
    .slide-in-up{ opacity:0; transform:translateY(24px); animation:inU .5s .2s ease forwards; }
    @keyframes fadeIn { to{opacity:1; transform:none} }
    @keyframes inL   { to{opacity:1; transform:none} }
    @keyframes inR   { to{opacity:1; transform:none} }
    @keyframes inU   { to{opacity:1; transform:none} }
    /* 검색창 폭 */
    .w-gu{ width:16rem; max-width:32vw; }
    .w-dong{ width:28rem; max-width:50vw; }
    /* 간단 로고(대체) */
    .logo-dot{ width:36px; height:36px; border-radius:999px; background:#111; position:relative; }
    .logo-dot::after{ content:":D"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#ff7a00; }
    /* 토스트(우상단) */
    #toastWrap{ position:fixed; top:76px; right:12px; z-index:1080; }
    /* 표쪽 보조 스타일 */
    .search-row .form-control{ min-width:160px; }
    .text-truncate-1 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 0; }
  </style>
</head>
<body>
  <!-- 상단 오렌지 바 -->
  <div class="topbar d-flex align-items-center px-2 px-md-3 fade-in">
    <button class="btn btn-dark me-2 slide-in-left" data-bs-toggle="offcanvas" data-bs-target="#menuCanvas" aria-controls="menuCanvas">☰ 메뉴</button>

    <!-- 상단 간편 검색(구/동) -->
    <form id="searchFormTop" class="d-flex align-items-center gap-2 mx-auto w-100 justify-content-center">
      <input id="qGuTop"   class="form-control w-gu slide-in-left"  placeholder="구 (예: 동구)" autocomplete="off">
      <input id="qDongTop" class="form-control w-dong slide-in-right" placeholder="동 (예: 대동)" autocomplete="off">
      <button class="btn btn-dark slide-in-right" type="submit">검색</button>
    </form>

    <div class="ms-auto slide-in-right d-flex align-items-center gap-2">
      <button id="btnZoomOut" class="btn btn-dark">−</button>
      <button id="btnZoomIn"  class="btn btn-dark">＋</button>
      <div class="logo-dot" title="Ontong:D"></div>
    </div>
  </div>

  <!-- 지도 -->
  <div id="map" class="slide-in-up"></div>

  <!-- 결과 표 + 상세 검색 -->
  <div class="container text-left mt-3">
    <div class="row justify-content-center">
      <div class="col-md-11">

        <!-- 상세 검색 폼 (가맹점/주소/구/동) -->
        <div class="search-row d-flex flex-wrap gap-2 align-items-end mb-2">
          <div>
            <label class="form-label mb-1">가맹점</label>
            <input type="text" id="qName" class="form-control" placeholder="예) 스미스비어">
          </div>
          <div>
            <label class="form-label mb-1">주소</label>
            <input type="text" id="qAddr" class="form-control" placeholder="예) 둔산대로 157">
          </div>
          <div>
            <label class="form-label mb-1">구</label>
            <input type="text" id="qGu" class="form-control" placeholder="예) 서구">
          </div>
          <div>
            <label class="form-label mb-1">동</label>
            <input type="text" id="qDong" class="form-control" placeholder="예) 둔산동">
          </div>
          <div class="ms-auto d-flex gap-2">
            <button id="searchBtn" class="btn btn-dark">검색</button>
            <button id="resetBtn" class="btn btn-outline-secondary">초기화</button>
          </div>
        </div>

        <!-- 표 -->
        <table class="table table-dark table-hover align-middle">
          <colgroup>
            <col style="width: 12%;">
            <col style="width: 12%;">
            <col style="width: 26%;">
            <col style="width: 40%;">
            <col style="width: 10%;">
          </colgroup>
          <thead>
            <tr>
              <th>순번</th>
              <th>구</th>
              <th>가맹점</th>
              <th>주소</th>
              <th>동</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>

        <!-- 페이지 네비 -->
        <div class="d-flex gap-2 align-items-center">
          <button id="prevBtn" class="btn btn-outline-light btn-sm">이전</button>
          <button id="nextBtn" class="btn btn-outline-light btn-sm">다음</button>
          <span id="pageInfo" class="ms-2 small"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- 오프캔버스: 간단 메뉴 -->
  <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="menuCanvas" aria-labelledby="menuCanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="menuCanvasLabel">메뉴</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body small">
      <ul class="list-unstyled">
        <li class="mb-2"><button id="goHome" class="badge text-bg-secondary border-0">홈</button></li>
        <li class="mb-2"><button id="goMyPos" class="badge text-bg-secondary border-0">내 위치로</button></li>
      </ul>
      <hr class="opacity-25">
      <p class="mb-0">※ odcloud 직접 호출 · 브라우저 키 노출 주의</p>
    </div>
  </div>

  <!-- 우상단 토스트 -->
  <div id="toastWrap" aria-live="polite" aria-atomic="true"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ====== 공통: 토스트 ====== */
    function showToast(msg){
      const id = 't' + Date.now();
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast align-items-center text-bg-dark border-0 mb-2';
      el.id = id;
      el.role = 'alert';
      el.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${msg}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>`;
      wrap.appendChild(el);
      const t = new bootstrap.Toast(el, { delay: 2200 });
      t.show();
      el.addEventListener('hidden.bs.toast', ()=> el.remove());
    }

    /* ====== Kakao Map ====== */
    let map, geocoder, markers=[];
    const DAEJEON_CITY_HALL = { lat:36.3504, lng:127.3845 };

    function initMap(){
      geocoder = new kakao.maps.services.Geocoder();
      const fallback = new kakao.maps.LatLng(DAEJEON_CITY_HALL.lat, DAEJEON_CITY_HALL.lng);
      map = new kakao.maps.Map(document.getElementById('map'), { center: fallback, level: 4 });

      // 줌 컨트롤
      const zoomControl = new kakao.maps.ZoomControl();
      map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

      // 현재 위치 마커
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
          const center = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
          map.setCenter(center);
          const me = new kakao.maps.Marker({ position:center });
          me.setMap(map);
        }, ()=>{}, { enableHighAccuracy:true, timeout:3000 });
      }
    }
    function clearMarkers(){ markers.forEach(m=>m.setMap(null)); markers.length=0; }

    // 지오코딩 큐 (과열 방지)
    const geoQueue = [];
    let geoBusy = false;
    function drainGeoQueue(intervalMs=90){
      if(geoBusy) return;
      geoBusy = true;
      (function step(){
        const job = geoQueue.shift();
        if(!job){ geoBusy = false; return; }
        geocoder.addressSearch(job.addr, function(result, status){
          if(status === kakao.maps.services.Status.OK){
            const pos = new kakao.maps.LatLng(result[0].y, result[0].x);
            const marker = new kakao.maps.Marker({ position: pos, title: job.title });
            marker.setMap(map);
            markers.push(marker);
          }
          setTimeout(step, intervalMs);
        });
      })();
    }

    /* ====== odcloud 호출 ====== */
    // ⚠️ 실서비스에서는 브라우저에 Key 노출 금지. 서버 프록시 권장.
    const API_KEY = "여기에_본인_serviceKey_입력"; // 예: "QpWP...=="
    const ENDPOINT = "https://api.odcloud.kr/api/15097203/v1/uddi:fc30c6ac-23a9-4d0b-95dd-f0e4f2ef3115";

    let page = 1;
    const perPage = 20;
    let lastServerRows = []; // 표 폴백용

    function getFiltersFromBottom(){
      return {
        name: ($("#qName").val()||"").trim(),
        addr: ($("#qAddr").val()||"").trim(),
        gu:   ($("#qGu").val()||"").trim(),
        dong: ($("#qDong").val()||"").trim(),
      };
    }
    function syncTopToBottom(){
      $("#qGu").val( $("#qGuTop").val().trim() );
      $("#qDong").val( $("#qDongTop").val().trim() );
    }
    function syncBottomToTop(){
      $("#qGuTop").val( $("#qGu").val().trim() );
      $("#qDongTop").val( $("#qDong").val().trim() );
    }

    function buildCondParams(q){
      const p = {};
      if(q.name) p["cond[가맹점::LIKE]"] = `%${q.name}%`;
      if(q.addr) p["cond[주소::LIKE]"]   = `%${q.addr}%`;
      if(q.gu)   p["cond[구::EQ]"]      = q.gu;
      if(q.dong) p["cond[동::EQ]"]      = q.dong;
      return p;
    }

    async function fetchOdcloud({ page=1, perPage=20, ...q }){
      const url = new URL(ENDPOINT);
      url.searchParams.set("page", page);
      url.searchParams.set("perPage", perPage);
      url.searchParams.set("returnType", "JSON");
      url.searchParams.set("serviceKey", API_KEY);
      const cond = buildCondParams(q);
      Object.keys(cond).forEach(k => url.searchParams.set(k, cond[k]));

      const res = await fetch(url.toString(), { headers: { "Accept": "application/json" }});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json(); // { page, perPage, totalCount, currentCount, matchCount, data: [...] }
      return data;
    }

    function renderRows(rows){
      const $tb = $("#tb").empty();
      if (!rows || rows.length === 0) {
        $tb.append(`<tr><td colspan="5" class="text-center">검색 결과가 존재하지 않습니다.</td></tr>`);
        return;
      }
      rows.forEach(item => {
        // 표 헤더 순서: 순번, 구, 가맹점, 주소, 동
        const tr = `
          <tr class="result-row" data-name="${(item["가맹점"]||"").replace(/"/g,'&quot;')}" data-addr="${(item["주소"]||"").replace(/"/g,'&quot;')}">
            <td>${item["순번"] ?? ""}</td>
            <td>${item["구"] ?? ""}</td>
            <td>${item["가맹점"] ?? ""}</td>
            <td class="text-truncate-1">${item["주소"] ?? ""}</td>
            <td>${item["동"] ?? ""}</td>
          </tr>`;
        $tb.append(tr);
      });

      // 행 클릭 시 해당 주소를 중심으로 이동(즉시 지오코딩 1회)
      $(".result-row").off("click").on("click", function(){
        const nm = this.dataset.name || "가맹점";
        const ad = this.dataset.addr;
        if(!ad) return;
        geocoder.addressSearch(ad, (result, status)=>{
          if(status === kakao.maps.services.Status.OK){
            const pos = new kakao.maps.LatLng(result[0].y, result[0].x);
            map.setLevel(3);
            map.setCenter(pos);
            showToast(`${nm}`);
          }
        });
      });
    }

    function updatePager(total, pageNo){
      const lastPage = total > 0 ? Math.ceil(total / perPage) : pageNo;
      page = pageNo;
      $("#pageInfo").text(`페이지 ${page} / ${lastPage} (총 ${total.toLocaleString()}건)`);
      $("#prevBtn").prop("disabled", page <= 1);
      $("#nextBtn").prop("disabled", page >= lastPage);
    }

    async function load(pageNo=1){
      const q = getFiltersFromBottom();
      $("#pageInfo").text(`로딩 중...`);
      showToast('조회중…');

      try{
        const res = await fetchOdcloud({ page:pageNo, perPage, ...q });
        const rows = res?.data ?? [];
        lastServerRows = rows;

        // 표 렌더
        renderRows(rows);
        updatePager(res?.totalCount ?? rows.length, pageNo);

        // 지도 마커 갱신
        clearMarkers();
        geoQueue.length = 0;
        rows.forEach(it => {
          const name = it["가맹점"] ?? "가맹점";
          const addr = it["주소"];
          if(addr) geoQueue.push({ title:name, addr });
        });
        drainGeoQueue(90);

        // 마커 영역으로 맞춤 (지오코딩 비동기 고려)
        setTimeout(()=>{
          if (markers.length){
            const bounds = new kakao.maps.LatLngBounds();
            markers.forEach(m => bounds.extend(m.getPosition()));
            map.setBounds(bounds, 40, 40, 40, 40);
          }
        }, 700);

      }catch(e){
        console.error(e);
        // 최소 폴백: 마지막 rows만 표시
        renderRows(lastServerRows);
        $("#pageInfo").text(`오류(클라이언트 표시)`);
        showToast('조회 오류: ' + e.message);
      }
    }

    /* ====== 이벤트 바인딩 ====== */
    document.addEventListener('DOMContentLoaded', ()=>{
      initMap();

      // 상단 간편검색 → 하단 필터와 동기화 후 조회
      $("#searchFormTop").on("submit", (e)=>{
        e.preventDefault();
        syncTopToBottom();
        load(1);
      });

      // 하단 상세검색
      $("#searchBtn").on("click", ()=> { syncBottomToTop(); load(1); });
      $("#resetBtn").on("click", ()=>{
        $("#qName,#qAddr,#qGu,#qDong,#qGuTop,#qDongTop").val("");
        load(1);
      });
      $("#qName,#qAddr,#qGu,#qDong").on("keydown", (e)=>{ if(e.key==='Enter'){ syncBottomToTop(); load(1);} });
      $("#qGuTop,#qDongTop").on("keydown", (e)=>{ if(e.key==='Enter'){ e.preventDefault(); syncTopToBottom(); load(1);} });

      // 페이지 이동
      $("#prevBnt"); // no-op guard
      $("#prevBtn").on("click", ()=> { if (page > 1) load(page - 1); });
      $("#nextBtn").on("click", ()=> load(page + 1));

      // 메뉴
      $("#goHome").on("click", ()=>{
        map.setLevel(4);
        map.setCenter(new kakao.maps.LatLng(DAEJEON_CITY_HALL.lat, DAEJEON_CITY_HALL.lng));
        bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('menuCanvas')).hide();
      });
      $("#goMyPos").on("click", ()=>{
        if(!navigator.geolocation){ showToast('브라우저가 위치를 지원하지 않습니다.'); return; }
        navigator.geolocation.getCurrentPosition(pos=>{
          const center = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
          map.setCenter(center);
          showToast('내 위치로 이동');
        }, ()=> showToast('위치 권한을 허용해주세요.'), { enableHighAccuracy:true, timeout:3000 });
        bootstrap.Offcanvas.getOrCreateInstance(document.getElementById('menuCanvas')).hide();
      });

      // 줌 버튼
      $("#btnZoomIn").on("click", ()=> map.setLevel(Math.max(1, map.getLevel()-1)));
      $("#btnZoomOut").on("click", ()=> map.setLevel(map.getLevel()+1));

      // 초기 조회 (빈 조건 → 전체 일부 페이지)
      load(1);
    });
  </script>

  <!-- 우상단 토스트 컨테이너 -->
  <div id="toastWrap" aria-live="polite" aria-atomic="true"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>대전광역시_온통대전 신청 가맹점 목록 조회</title>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
</head>
<body>
  <div class="container text-left">
    <div class="row justify-content-center">
      <div class="col-md-10 mt-2 pt-5">
        <table class="table table-dark table-hover align-middle">
          <colgroup>
            <col style="width: 12%;">
            <col style="width: 18%;">
            <col style="width: 50%;">
            <col style="width: 12%;">
            <col style="width: 8%;">
          </colgroup>
          <thead>
            <tr>
              <th>순번</th>
              <th>가맹점</th>
              <th>주소</th>
              <th>동</th>
              <th>구</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>

        <!-- 간단한 페이지 네비게이션 -->
        <div class="d-flex gap-2">
          <button id="prevBtn" class="btn btn-outline-light btn-sm">이전</button>
          <button id="nextBtn" class="btn btn-outline-light btn-sm">다음</button>
          <span id="pageInfo" class="ms-2 small"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 브라우저에 키가 노출됩니다. 실서비스는 서버에서 호출하거나 프록시를 두세요.
    const API_KEY = "QpWPp9txkmGnVhhlXoHPY8ifB9x/4qxyqYeCH7jFzB82up9cr2dCbJI7veH8NjbhVOzcBFRTKDMgpWQmA/bf2A==";
    const ENDPOINT = "https://api.odcloud.kr/api/15097203/v1/uddi:fc30c6ac-23a9-4d0b-95dd-f0e4f2ef3115";

    let page = 1;
    const perPage = 13;

    function renderRows(rows) {
      const $tb = $("#tb");
      $tb.empty();

      if (!rows || rows.length === 0) {
        $tb.append(`<tr><td colspan="5" class="text-center">검색 결과가 존재하지 않습니다.</td></tr>`);
        return;
      }

      rows.forEach(item => {
        const seq   = item["순번"] ?? "";
        const name  = item["가맹점"] ?? "";
        const addr  = item["주소"] ?? "";
        const dong  = item["동"] ?? "";
        const gu    = item["구"] ?? "";

        const tr = `
          <tr>
            <td>${seq}</td>
            <td>${name}</td>
            <td class="text-truncate" style="max-width: 0;">${addr}</td>
            <td>${dong}</td>
            <td>${gu}</td>
          </tr>`;
        $tb.append(tr);
      });
    }

    function load(pageNo = 1) {
      $("#pageInfo").text(`로딩 중...`);

      $.ajax({
        url: ENDPOINT,
        type: "GET",
        dataType: "json",
        data: {
          page: pageNo,
          perPage: perPage,
          returnType: "JSON",
          serviceKey: API_KEY  // 쿼리스트링 방식 (Swagger의 ApiKeyAuth2)
        },
        success: function (res) {
          // odcloud 포맷: { page, perPage, totalCount, currentCount, matchCount, data: [...] }
          const rows = res && res.data ? res.data : [];
          renderRows(rows);

          const total = res && typeof res.totalCount === "number" ? res.totalCount : 0;
          const lastPage = total > 0 ? Math.ceil(total / perPage) : pageNo;

          page = pageNo;
          $("#pageInfo").text(`페이지 ${page} / ${lastPage} (총 ${total.toLocaleString()}건)`);
          $("#prevBtn").prop("disabled", page <= 1);
          $("#nextBtn").prop("disabled", page >= lastPage);
        },
        error: function (e) {
          console.error(e);
          $("#tb").html(`<tr><td colspan="5" class="text-center text-danger">요청 중 오류가 발생했습니다.</td></tr>`);
          $("#pageInfo").text(`오류`);
        }
      });

      // ※ 헤더 방식 사용을 원하면 아래처럼 사용하세요 (서버가 CORS를 허용해야 함):
      // $.ajax({
      //   url: ENDPOINT + `?page=${pageNo}&perPage=${perPage}&returnType=JSON`,
      //   type: "GET",
      //   dataType: "json",
      //   headers: { "Authorization": encodeURIComponent(API_KEY) } // Swagger의 ApiKeyAuth
      //   ...
      // });
    }

    $("#prevBtn").on("click", () => {
      if (page > 1) load(page - 1);
    });
    $("#nextBtn").on("click", () => {
      load(page + 1);
    });

    // 최초 로드
    load(1);
  </script>
</body>
</html>

<!doctype html>
<html lang="ko" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <title>온통대전 가맹점 지도 검색 (odcloud 연동 단일파일)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Kakao Map SDK (services 포함) -->
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=7bdd6f8f52c48f9801f463f213f0d03e&libraries=services"></script>

  <style>
    :root { color-scheme: dark; }
    body{ background:#0b0c0f; }
    .topbar{ background:#ff7a00; height:64px; }
    .topbar .form-control{ background:#1b1e23; border-color:#2a2f36; color:#eaecef; }
    .topbar .btn{ border-color:#2a2f36; }
    #map{ width:100%; height:calc(100dvh - 64px); }
    .fade-in{ opacity:0; transform:translateY(-24px); animation:fadeIn .6s ease forwards; }
    .slide-in-left{ opacity:0; transform:translateX(-24px); animation:inL .5s .1s ease forwards; }
    .slide-in-right{ opacity:0; transform:translateX(24px); animation:inR .5s .1s ease forwards; }
    .slide-in-up{ opacity:0; transform:translateY(24px); animation:inU .5s .2s ease forwards; }
    @keyframes fadeIn { to{opacity:1; transform:none} }
    @keyframes inL   { to{opacity:1; transform:none} }
    @keyframes inR   { to{opacity:1; transform:none} }
    @keyframes inU   { to{opacity:1; transform:none} }
    .w-gu{ width:16rem; max-width:32vw; }
    .w-dong{ width:16rem; max-width:32vw; }
    .w-name{ width:18rem; max-width:40vw; }
    .logo-dot{ width:36px; height:36px; border-radius:999px; background:#111; position:relative; }
    .logo-dot::after{ content:":D"; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:700; color:#ff7a00; }
    #toastWrap{ position:fixed; top:76px; right:12px; z-index:1080; }
    .btn-zoom{ border-color:#2a2f36; }
  </style>
</head>
<body>
  <!-- 상단 오렌지 바 -->
  <div class="topbar d-flex align-items-center px-2 px-md-3 fade-in">
    <button class="btn btn-dark me-2 slide-in-left" data-bs-toggle="offcanvas" data-bs-target="#menuCanvas" aria-controls="menuCanvas">☰ 메뉴</button>

    <!-- 검색 폼 (odcloud cond[...] 기반) -->
    <form id="searchForm" class="d-flex align-items-center gap-2 mx-auto w-100 justify-content-center">
      <input id="qGu"   class="form-control w-gu   slide-in-left"  placeholder="구 (예: 동구)" autocomplete="off">
      <input id="qDong" class="form-control w-dong slide-in-right" placeholder="동 (예: 대동)" autocomplete="off">
      <!-- 필요하면 아래 두 필드를 보이게 하고 cond LIKE로 검색 가능 -->
      <!-- <input id="qName" class="form-control w-name" placeholder="가맹점명 (예: 스미스비어)" autocomplete="off">
      <input id="qAddr" class="form-control w-name" placeholder="주소 키워드 (예: 둔산대로)" autocomplete="off"> -->
      <button id="searchBtn" class="btn btn-dark slide-in-right" type="submit">검색</button>
    </form>

    <div class="ms-auto slide-in-right d-flex align-items-center gap-2">
      <button id="btnZoomOut" class="btn btn-dark btn-zoom">−</button>
      <button id="btnZoomIn"  class="btn btn-dark btn-zoom">＋</button>
      <div class="logo-dot" title="Ontong:D"></div>
    </div>
  </div>

  <!-- 지도 -->
  <div id="map" class="slide-in-up"></div>

  <!-- 오프캔버스: 메뉴 -->
  <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="menuCanvas" aria-labelledby="menuCanvasLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="menuCanvasLabel">메뉴</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body small">
      <ul class="list-unstyled">
        <li class="mb-2"><button id="goHome" class="badge text-bg-secondary border-0">홈</button></li>
        <li class="mb-2"><button id="goMyPos" class="badge text-bg-secondary border-0">내 위치로</button></li>
      </ul>

      <hr class="opacity-25">
      <!-- 회원 기능(스프링 경로 예시) -->
      <div class="mb-2">회원</div>
      <div class="d-flex flex-wrap gap-2">
        <a class="btn btn-outline-light btn-sm" href="/member/login">로그인</a>
        <a class="btn btn-outline-light btn-sm" href="/member/join">회원가입</a>
        <a class="btn btn-outline-light btn-sm" href="/member/profile">프로필</a>
      </div>

      <hr class="opacity-25">
      <div class="mb-2">지도 오버레이</div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="ovlTraffic">
        <label class="form-check-label" for="ovlTraffic">교통정보</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="ovlRoadview">
        <label class="form-check-label" for="ovlRoadview">로드뷰 도로선</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" id="ovlTerrain">
        <label class="form-check-label" for="ovlTerrain">지형정보</label>
      </div>

      <button id="btnAllOn"  class="btn btn-outline-light btn-sm mt-2">모두 켜기</button>
      <button id="btnAllOff" class="btn btn-outline-light btn-sm mt-2">모두 끄기</button>

      <hr class="opacity-25">
      <p class="mb-0">※ odcloud(공공데이터포털) 직접 호출 버전.</p>
    </div>
  </div>

  <!-- 우상단 토스트 -->
  <div id="toastWrap" aria-live="polite" aria-atomic="true"></div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    /* ====== 공통: 토스트 ====== */
    function showToast(msg){
      const id = 't' + Date.now();
      const wrap = document.getElementById('toastWrap');
      const el = document.createElement('div');
      el.className = 'toast align-items-center text-bg-dark border-0 mb-2';
      el.id = id;
      el.role = 'alert';
      el.innerHTML = `
        <div class="d-flex">
          <div class="toast-body">${msg}</div>
          <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>`;
      wrap.appendChild(el);
      const t = new bootstrap.Toast(el, { delay: 2200 });
      t.show();
      el.addEventListener('hidden.bs.toast', ()=> el.remove());
    }

    /* ====== Kakao Map ====== */
    let map, geocoder, markers=[];
    const DAEJEON_CITY_HALL = { lat:36.3504, lng:127.3845 };

    // 오버레이 상태
    const onSet = new Set();
    const mapTypes = {
      traffic: kakao.maps.MapTypeId.TRAFFIC,
      roadview: kakao.maps.MapTypeId.ROADVIEW,
      terrain: kakao.maps.MapTypeId.TERRAIN
    };

    function initMap(){
      geocoder = new kakao.maps.services.Geocoder();
      const fallback = new kakao.maps.LatLng(DAEJEON_CITY_HALL.lat, DAEJEON_CITY_HALL.lng);
      map = new kakao.maps.Map(document.getElementById('map'), { center: fallback, level: 4 });

      // 줌 가능 + 기본 ZoomControl
      map.setZoomable(true);
      const zoomControl = new kakao.maps.ZoomControl();
      map.addControl(zoomControl, kakao.maps.ControlPosition.RIGHT);

      // 현재 위치
      if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(pos=>{
          const center = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
          map.setCenter(center);
          const me = new kakao.maps.Marker({ position:center });
          me.setMap(map);
        }, ()=>{}, { enableHighAccuracy:true, timeout:3000 });
      }
    }

    function clearMarkers(){ markers.forEach(m=>m.setMap(null)); markers.length=0; }

    // 지오코딩 큐(요청 과열 방지)
    const geoQueue = [];
    let geoBusy = false;
    function drainGeoQueue(intervalMs=90){
      if(geoBusy) return;
      geoBusy = true;
      (function step(){
        const job = geoQueue.shift();
        if(!job){ geoBusy = false; return; }
        geocoder.addressSearch(job.addr, function(result, status){
          if(status === kakao.maps.services.Status.OK){
            const pos = new kakao.maps.LatLng(result[0].y, result[0].x);
            const marker = new kakao.maps.Marker({ position: pos, title: job.title });
            marker.setMap(map);
            markers.push(marker);
            const html = `
              <div style="padding:6px 8px;max-width:240px;">
                <div style="font-weight:600;margin-bottom:3px;">${job.title ?? '가맹점'}</div>
                <div style="font-size:12px;opacity:.85;">${job.addr}</div>
              </div>`;
            const iw = new kakao.maps.InfoWindow({ content: html });
            kakao.maps.event.addListener(marker, 'mouseover', ()=> iw.open(map, marker));
            kakao.maps.event.addListener(marker, 'mouseout',  ()=> iw.close());
          }
          setTimeout(step, intervalMs);
        });
      })();
    }

    /* ====== odcloud 호출 ====== */
    // ⚠️ 실서비스에서는 브라우저에 Key 노출 금지. 서버 프록시 권장.
    const API_KEY = "여기에_본인_serviceKey_입력"; // 예: "QpWP...=="
    const ODCLOUD_ENDPOINT = "https://api.odcloud.kr/api/15097203/v1/uddi:fc30c6ac-23a9-4d0b-95dd-f0e4f2ef3115";

    function buildCondParams({ gu, dong, name, addr }){
      const p = {};
      if(gu)   p["cond[구::EQ]"]      = gu;          // 완전일치
      if(dong) p["cond[동::EQ]"]      = dong;        // 완전일치
      if(name) p["cond[가맹점::LIKE]"] = `%${name}%`; // 부분일치
      if(addr) p["cond[주소::LIKE]"]   = `%${addr}%`; // 부분일치
      return p;
    }

    async function fetchOdcloud({ page=1, perPage=30, gu, dong, name, addr }){
      const url = new URL(ODCLOUD_ENDPOINT);
      url.searchParams.set("page", page);
      url.searchParams.set("perPage", perPage);
      url.searchParams.set("returnType", "JSON");
      url.searchParams.set("serviceKey", API_KEY);
      const cond = buildCondParams({ gu, dong, name, addr });
      Object.keys(cond).forEach(k => url.searchParams.set(k, cond[k]));

      const res = await fetch(url.toString(), { headers: { "Accept": "application/json" }});
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json(); // { page, perPage, totalCount, currentCount, matchCount, data: [...] }
      return data?.data ?? [];
    }

    /* ====== 검색 핸들러 ====== */
    async function onSearch(e){
      e?.preventDefault();
      const gu   = document.getElementById('qGu').value.trim();
      const dong = document.getElementById('qDong').value.trim();
      // 필요 시 아래 두 줄 주석 해제하고 input 추가해서 사용
      // const name = (document.getElementById('qName')?.value || '').trim();
      // const addr = (document.getElementById('qAddr')?.value || '').trim();

      if(!gu && !dong){ showToast('구 또는 동을 입력해주세요. (예: 동구 / 대동)'); return; }

      clearMarkers();
      geoQueue.length = 0;
      showToast('조회중…');

      try{
        const items = await fetchOdcloud({ page:1, perPage:50, gu, dong /*, name, addr*/ });
        if(!items.length){ showToast('검색 결과가 없습니다.'); return; }

        // 큐에 적재 → 순차 지오코딩
        items.forEach(it => {
          const title = it["가맹점"] ?? "가맹점";
          const addr  = it["주소"];
          if(addr) geoQueue.push({ title, addr });
        });
        drainGeoQueue(90);

        // 마커들 영역으로 지도 맞춤(지오코딩 비동기 고려)
        setTimeout(()=> {
          if (markers.length){
            const bounds = new kakao.maps.LatLngBounds();
            markers.forEach(m => bounds.extend(m.getPosition()));
            map.setBounds(bounds, 40, 40, 40, 40);
          }
        }, 700);

        showToast(`가맹점 ${items.length}건 표시`);
      }catch(err){
        console.error(err);
        showToast('조회 오류: ' + err.message);
      }
    }

    /* ====== 오버레이 토글 ====== */
    function setOverlay(typeKey, on){
      const typeId = mapTypes[typeKey];
      if(!typeId) return;
      if(on){
        if(!onSet.has(typeKey)){ map.addOverlayMapTypeId(typeId); onSet.add(typeKey); }
      }else{
        if(onSet.has(typeKey)){ map.removeOverlayMapTypeId(typeId); onSet.delete(typeKey); }
      }
    }
    function bindOverlayCheckbox(id, key){
      const el = document.getElementById(id);
      el.addEventListener('change', ()=> setOverlay(key, el.checked));
    }
    function allOn(){
      const list = [
        ['ovlTerrain','terrain'],
        ['ovlRoadview','roadview'],
        ['ovlTraffic','traffic'],
      ];
      list.forEach(([id, key])=>{
        const el = document.getElementById(id);
        if(el){ el.checked = true; setOverlay(key, true); }
      });
      showToast('모든 오버레이 켜짐');
    }
    function allOff(){
      onSet.forEach(k => map.removeOverlayMapTypeId(mapTypes[k]));
      onSet.clear();
      ['ovlTraffic','ovlRoadview','ovlTerrain'].forEach(id=>{
        const el = document.getElementById(id);
        if(el) el.checked = false;
      });
      showToast('모든 오버레이 꺼짐');
    }

    /* ====== 메뉴/초기화 ====== */
    function closeOffcanvas(){
      const el = document.getElementById('menuCanvas');
      const inst = bootstrap.Offcanvas.getOrCreateInstance(el);
      inst.hide();
    }
    function goMyPosition(){
      if(!navigator.geolocation){ showToast('브라우저가 위치를 지원하지 않습니다.'); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        const center = new kakao.maps.LatLng(pos.coords.latitude, pos.coords.longitude);
        map.setCenter(center);
        showToast('내 위치로 이동');
      }, ()=> showToast('위치 권한을 허용해주세요.'), { enableHighAccuracy:true, timeout:3000 });
    }

    /* ====== 부트스트랩/이벤트 바인딩 ====== */
    document.addEventListener('DOMContentLoaded', ()=>{
      initMap();

      // 검색
      document.getElementById('searchForm').addEventListener('submit', onSearch);
      document.getElementById('qGu').addEventListener('keydown',   (e)=>{ if(e.key==='Enter') onSearch(e) });
      document.getElementById('qDong').addEventListener('keydown', (e)=>{ if(e.key==='Enter') onSearch(e) });
      // 메뉴
      document.getElementById('goHome').addEventListener('click', ()=>{
        map.setLevel(4);
        map.setCenter(new kakao.maps.LatLng(DAEJEON_CITY_HALL.lat, DAEJEON_CITY_HALL.lng));
        closeOffcanvas();
      });
      document.getElementById('goMyPos').addEventListener('click', ()=>{ goMyPosition(); closeOffcanvas(); });
      // 오버레이 체크박스
      bindOverlayCheckbox('ovlTraffic', 'traffic');
      bindOverlayCheckbox('ovlRoadview', 'roadview');
      bindOverlayCheckbox('ovlTerrain',  'terrain');
      document.getElementById('btnAllOn').addEventListener('click', allOn);
      document.getElementById('btnAllOff').addEventListener('click', allOff);
      // 확대/축소 버튼
      document.getElementById('btnZoomIn').addEventListener('click', ()=> map.setLevel(Math.max(1, map.getLevel()-1)));
      document.getElementById('btnZoomOut').addEventListener('click', ()=> map.setLevel(map.getLevel()+1));
    });
  </script>
</body>
</html>

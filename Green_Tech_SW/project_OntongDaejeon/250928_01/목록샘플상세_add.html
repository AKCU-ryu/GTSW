<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>대전광역시_온통대전 신청 가맹점 목록 조회</title>
  <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>
  <style>
    .search-row .form-control{ min-width: 160px; }
    .text-truncate-1 { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width: 0; }
  </style>
</head>
<body>
  <div class="container text-left">
    <div class="row justify-content-center">
      <div class="col-md-10 mt-4">

        <!-- 검색 폼 -->
        <div class="search-row d-flex flex-wrap gap-2 align-items-end mb-2">
          <div>
            <label class="form-label mb-1">가맹점</label>
            <input type="text" id="qName" class="form-control" placeholder="예) 스미스비어">
          </div>
          <div>
            <label class="form-label mb-1">주소</label>
            <input type="text" id="qAddr" class="form-control" placeholder="예) 둔산대로 157">
          </div>
          <div>
            <label class="form-label mb-1">구</label>
            <input type="text" id="qGu" class="form-control" placeholder="예) 서구">
          </div>
          <div>
            <label class="form-label mb-1">동</label>
            <input type="text" id="qDong" class="form-control" placeholder="예) 둔산동">
          </div>
          <div class="ms-auto d-flex gap-2">
            <button id="searchBtn" class="btn btn-dark">검색</button>
            <button id="resetBtn" class="btn btn-outline-secondary">초기화</button>
          </div>
        </div>

        <table class="table table-dark table-hover align-middle">
          <colgroup>
            <col style="width: 12%;">
            <col style="width: 20%;">
            <col style="width: 50%;">
            <col style="width: 10%;">
            <col style="width: 8%;">
          </colgroup>
          <thead>
            <tr>
              <th>순번</th>
              <th>가맹점</th>
              <th>주소</th>
              <th>동</th>
              <th>구</th>
            </tr>
          </thead>
          <tbody id="tb"></tbody>
        </table>

        <!-- 페이지 네비 -->
        <div class="d-flex gap-2 align-items-center">
          <button id="prevBtn" class="btn btn-outline-light btn-sm">이전</button>
          <button id="nextBtn" class="btn btn-outline-light btn-sm">다음</button>
          <span id="pageInfo" class="ms-2 small"></span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ 실서비스에선 브라우저에 키 노출 금지 (서버 프록시 권장)
    const API_KEY = "QpWPp9txkmGnVhhlXoHPY8ifB9x/4qxyqYeCH7jFzB82up9cr2dCbJI7veH8NjbhVOzcBFRTKDMgpWQmA/bf2A==";
    const ENDPOINT = "https://api.odcloud.kr/api/15097203/v1/uddi:fc30c6ac-23a9-4d0b-95dd-f0e4f2ef3115";

    let page = 1;
    const perPage = 20;
    let lastServerRows = [];  // 최근 서버 응답 저장 (클라이언트 필터 폴백용)

    function getQuery() {
      return {
        name: ($("#qName").val()||"").trim(),
        addr: ($("#qAddr").val()||"").trim(),
        gu:   ($("#qGu").val()||"").trim(),
        dong: ($("#qDong").val()||"").trim(),
      };
    }

    function buildCondParams(q) {
      // odcloud 조건검색: cond[컬럼::연산자]=값
      // 부분일치: LIKE, 완전일치: EQ
      const params = {};
      if (q.name) params["cond[가맹점::LIKE]"] = `%${q.name}%`;
      if (q.addr) params["cond[주소::LIKE]"]   = `%${q.addr}%`;
      if (q.gu)   params["cond[구::EQ]"]      = q.gu;
      if (q.dong) params["cond[동::EQ]"]      = q.dong;
      return params;
    }

    function renderRows(rows) {
      const $tb = $("#tb").empty();
      if (!rows || rows.length === 0) {
        $tb.append(`<tr><td colspan="5" class="text-center">검색 결과가 존재하지 않습니다.</td></tr>`);
        return;
      }
      rows.forEach(item => {
        const tr = `
        <tr>
          <td>${item["순번"] ?? ""}</td>
          <td>${item["가맹점"] ?? ""}</td>
          <td class="text-truncate-1">${item["주소"] ?? ""}</td>
          <td>${item["동"] ?? ""}</td>
          <td>${item["구"] ?? ""}</td>
        </tr>`;
        $tb.append(tr);
      });
    }

    function clientFilter(rows, q) {
      // 서버 검색이 실패하거나 cond 미지원 시 현재 페이지 결과에서 부분 필터
      const f = (v) => (v||"").toString().toLowerCase();
      return rows.filter(it => {
        const name = f(it["가맹점"]);
        const addr = f(it["주소"]);
        const gu   = f(it["구"]);
        const dong = f(it["동"]);
        const okName = !q.name || name.includes(q.name.toLowerCase());
        const okAddr = !q.addr || addr.includes(q.addr.toLowerCase());
        const okGu   = !q.gu   || gu   === q.gu.toLowerCase();
        const okDong = !q.dong || dong === q.dong.toLowerCase();
        return okName && okAddr && okGu && okDong;
      });
    }

    function updatePager(total, pageNo) {
      const lastPage = total > 0 ? Math.ceil(total / perPage) : pageNo;
      page = pageNo;
      $("#pageInfo").text(`페이지 ${page} / ${lastPage} (총 ${total.toLocaleString()}건)`);
      $("#prevBtn").prop("disabled", page <= 1);
      $("#nextBtn").prop("disabled", page >= lastPage);
    }

    function load(pageNo = 1) {
      const q = getQuery();
      $("#pageInfo").text(`로딩 중...`);

      const data = {
        page: pageNo,
        perPage: perPage,
        returnType: "JSON",
        serviceKey: API_KEY,
        ...buildCondParams(q) // 가능하면 서버 조건검색
      };

      $.ajax({
        url: ENDPOINT,
        type: "GET",
        dataType: "json",
        data,
        success: function (res) {
          const rows  = (res && res.data) ? res.data : [];
          lastServerRows = rows;
          const total = (res && typeof res.totalCount === "number") ? res.totalCount : rows.length;

          // 서버가 cond를 잘 적용한 경우 그대로 표출, 아니면 클라 필터 보정
          const shown = (q.name || q.addr || q.gu || q.dong) ? clientFilter(rows, q) : rows;

          renderRows(shown);
          updatePager(total, pageNo);
        },
        error: function () {
          // 폴백: 최근 서버 데이터(또는 빈배열)에 클라이언트 필터만 적용
          const rows = clientFilter(lastServerRows, q);
          renderRows(rows);
          $("#pageInfo").text(`오류(클라이언트 필터 표시 중)`);
        }
      });
    }

    // 이벤트 바인딩
    $("#searchBtn").on("click", () => load(1));
    $("#resetBtn").on("click", () => {
      $("#qName,#qAddr,#qGu,#qDong").val("");
      load(1);
    });

    // Enter 키 검색
    $("#qName,#qAddr,#qGu,#qDong").on("keydown", (e) => {
      if (e.key === "Enter") load(1);
    });

    $("#prevBtn").on("click", () => { if (page > 1) load(page - 1); });
    $("#nextBtn").on("click", () => load(page + 1));

    // 최초 로드
    load(1);
  </script>
</body>
</html>
